name: Close stale sessions

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  close-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoint
        run: |
          curl --fail --silent --show-error \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.VERCEL_APP_URL }}/api/cron/close-stale"
